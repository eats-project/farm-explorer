		async function populateTunnelDropdown() {
    const dropdown = document.getElementById("tunnelSelection");

    try {
        // Fetch the data from /getAgriParcels
        const response = await fetch("/getAgriParcels");
        const data = await response.json();

        

        // Populate dropdown with options
        data.forEach(parcel => {
            let option = document.createElement("option");
            option.value = parcel.foi; // Use foi as value
            option.textContent = parcel.label; // Use label as option text
            dropdown.appendChild(option);
        });

    } catch (error) {
        console.error("Error fetching AgriParcels:", error);
    }
}

// Helper function to format date in BST (British Summer Time)
function formatBST(date) {
    let bstFormatter = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/London",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
    });

    let parts = bstFormatter.formatToParts(date);
    let formattedDate = `${parts[4].value}-${parts[2].value}-${parts[0].value}T${parts[6].value}:${parts[8].value}:${parts[10].value}+01:00`;
    
    return formattedDate;
}
